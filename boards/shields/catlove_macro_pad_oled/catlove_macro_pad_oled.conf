CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_POINTING=y
# Keep the OLED on: ZMK blanks SSD1306 panels on idle (30 s) and on this board
# the panel does not come back on key press. Status screen stays always-on.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
